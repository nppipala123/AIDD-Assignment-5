{% extends 'layout.html' %}

{% block title %}Add Project{% endblock %}

{% block content %}
  <section>
    <h2>Add Project</h2>

    <div class="card form-card" style="max-width:820px; margin-top:0.75rem;">
      <div class="card-body">
        <form action="{{ url_for('add_project') }}" method="post" class="form-grid" aria-label="Add project form">
          <div class="form-group">
            <label for="title">Title</label>
            <input id="title" type="text" name="title" required placeholder="Project title">
          </div>

          <div class="form-group">
            <label for="image">Image file name <small style="color:var(--muted);display:block;margin-top:4px;font-weight:400">(place file in <code>static/images</code>)</small></label>
            <input id="image" type="text" name="image" placeholder="e.g. Workday Studio.jpg">
          </div>

          <div class="form-group" style="grid-column:1 / -1">
            <label for="description">Description</label>
            <textarea id="description" name="description" rows="5" required placeholder="Short description"></textarea>
          </div>

          <div class="form-actions" style="grid-column:1 / -1; display:flex; gap:0.5rem; justify-content:flex-start; margin-top:0.25rem">
            <button class="btn" type="submit">Save</button>
            <a class="btn ghost" href="{{ url_for('projects') }}">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </section>
{% endblock %}
